<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitCast</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>SplitCast</h1>
      <p id="state" role="status">Connect to the local Agent</p>
    </header>
    <section aria-label="Connect">
      <label for="token">Local control token</label>
      <div class="row">
        <input id="token" type="password" autocomplete="off" spellcheck="false">
        <button type="button" data-command="status">Connect / Refresh</button>
      </div>
    </section>
    <section aria-labelledby="session-heading">
      <h2 id="session-heading">Session</h2>
      <div class="row">
        <button type="button" data-command="prepare">Prepare media</button>
        <button type="button" data-command="prepare" data-args='{"media":false}'>Prepare speech</button>
        <button type="button" data-command="devices">Discover devices</button>
        <button type="button" data-command="routes">Routes</button>
      </div>
      <label for="output">Output</label>
      <div class="row">
        <select id="output">
          <option value="recording">Private recording</option>
          <option value="twitch-test">Twitch bandwidth test</option>
          <option value="twitch-live">Twitch public broadcast</option>
        </select>
        <button type="button" data-command="start">Start</button>
        <button type="button" data-command="stop" class="stop">Stop</button>
      </div>
      <label for="duration">Maximum output duration in seconds (required for public output)</label>
      <input id="duration" type="number" min="1" max="28800" step="1">
    </section>
    <section aria-labelledby="audio-heading">
      <h2 id="audio-heading">Audio and preview</h2>
      <div class="row">
        <button type="button" data-command="mic" data-args='{"action":"mute"}'>Mute microphone</button>
        <button type="button" data-command="mic" data-args='{"action":"unmute"}'>Unmute microphone</button>
        <button type="button" data-command="tts">Speech status</button>
        <button type="button" data-command="preview">OBS preview</button>
      </div>
      <label for="speech">Test speech</label>
      <div class="row">
        <input id="speech" maxlength="500">
        <button type="button" data-command="say">Speak</button>
      </div>
    </section>
    <img id="preview" alt="SplitCast scene from production OBS" hidden>
    <pre id="result" aria-live="polite"></pre>
  </main>
</body>
</html>
