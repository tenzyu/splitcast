version = 1
role = "production"

# Pair with example.toml. Provision mode-0600 credential files independently.

[peer]
ssh_host = "capture-host"
ssh_port = 22
control_port = 17871
remote_control_port = 17870
forward_control_port = 17873
token_file = "~/.config/splitcast/production.token"
remote_token_file = "~/.config/splitcast/control.token"
state_dir = "~/.local/state/splitcast"
timeout_seconds = 15

[capture]
# Production receives this geometry and transport from capture.
target = ""
game_audio = ""
width = 1280
height = 720
fps = 60
bitrate_kbps = 12000
rtmp_port = 1935
rtsp_port = 8554
api_port = 9997

[audio]
mic_source = ""
tts_sink = ""
tts_volume_percent = 100
processed_sink = "splitcast_mic"
# Choose the installed RNNoise LADSPA file. The Nix module supplies its package path.
rnnoise_plugin = "/usr/lib/ladspa/librnnoise.so"
rnnoise_label = "noise_suppressor_mono"
rnnoise_control = "50|200|0|0|0"
gain_db = 0
mic_offset_ms = 0

[obs]
binary = "obs"
websocket_port = 4455
password_file = "~/.config/splitcast/obs.password"
recording_dir = "~/Videos/SplitCast"
bitrate_kbps = 6000
video_mode = "hardware" # NVIDIA-backed isolated display and OBS encoder required.
separate_audio_tracks = true # Private MKV tracks 1 mix, 2 game, 3 processed mic.

[tts]
enabled = false # Enable on both hosts with the same expiry for speech return.
voicevox_url = "http://127.0.0.1:50021"
speaker = 3
queue_limit = 16
expiry_seconds = 60
max_text = 200
eventsub = false # Enable on production after provisioning chat credentials.
credentials_file = "~/.config/splitcast/twitch.json"

[twitch]
ingest_host = "apn10.contribute.live-video.net" # Select the official regional RTMPS endpoint.
key_file = "~/.config/splitcast/stream-key"
allow_public = false

# Optional capture-host camera. Match the enabled capture configuration.
# [camera]
# location = "capture"
# input_format = "yuyv422"
# encoder = "libx264"
# width = 320
# height = 180
# fps = 15
