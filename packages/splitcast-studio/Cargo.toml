[workspace]

[package]
name = "splitcast-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Linux desktop control for the authenticated SplitCast Agent"

[dependencies]
base64 = "0.22"
flume = { version = "0.11", default-features = false, features = ["async"] }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
splitcast-rs-core = { path = "../splitcast-rs" }
unicode-segmentation = "1"
ureq = { version = "3.1.2", default-features = false }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = "debuginfo"
